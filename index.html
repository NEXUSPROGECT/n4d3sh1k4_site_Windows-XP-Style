<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Михаил Кривошеев — Backend/Android Developer | Портфолио</title>
    <meta name="description" content="Backend-разработчик на Java/Spring, Android, Linux. Пет-проекты: Spring Auth Server, PEMZ Site, TestPhone." />

    <link rel="canonical" href="https://n4d3sh1k4.site/" />

    <link rel="alternate" hreflang="ru" href="https://n4d3sh1k4.site/" />
    <link rel="alternate" hreflang="en" href="https://n4d3sh1k4.site/" />
    <link rel="alternate" hreflang="x-default" href="https://n4d3sh1k4.site/" />

    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Михаил Кривошеев — Backend/Android Developer" />
    <meta property="og:description" content="Backend-разработчик на Java/Spring, Android, Linux. Пет-проекты: Spring Auth Server, PEMZ Site, TestPhone." />
    <meta property="og:url" content="https://n4d3sh1k4.site/" />
    <meta property="og:image" content="assets/avatar.jpg" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Nexus Project" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Михаил Кривошеев — Backend/Android Developer" />
    <meta name="twitter:description" content="Backend-разработчик на Java/Spring, Android, Linux." />
    <meta name="twitter:image" content="assets/avatar.jpg" />

    <link rel="stylesheet" href="https://unpkg.com/xp.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
  <div class="viewport">
      <div class="desktop" id="desktop">

        <div class="mobile-lang-selector">
          <button onclick="switchLanguage('ru')" class="lang-btn" lang="ru">RU</button>
          <button onclick="switchLanguage('en')" class="lang-btn" lang="en">EN</button>
        </div>

        <div id="loader" class="window" style="width:300px; height:80px; top:200px; left:calc(50% - 150px);" role="status">
          <div class="title-bar" data-i18n="loader.title">Загрузка</div>
          <div class="window-body" style="padding:5px;">
            <span data-i18n="loader.loading">Загрузка ресурсов....</span>

            <progress id="progress" max="100" value="0" style="width:100%"></progress>
          </div>
        </div>

        <nav class="desktop-icons" aria-label="Desktop shortcuts">
          <div class="desktop-icon" ondblclick="openWindow('projectsWindow')">
            <img src="assets/icons/documents.png" alt="Projects" />
            <span data-i18n="desktop.projects">Projects</span>
          </div>
          <div class="desktop-icon" ondblclick="openWindow('profileWindow')">
            <img src="assets/icons/аccount.png" alt="Profile" />
            <span data-i18n="desktop.profile">Profile</span>
          </div>
          <div class="desktop-icon" ondblclick="openWindow('aboutWindow')">
            <img src="assets/icons/notepad.png" alt="About" />
            <span data-i18n="desktop.about">About.txt</span>
          </div>
          <div class="desktop-icon" ondblclick="window.open('https://github.com/NEXUSPROGECT')">
            <img src="assets/icons/github.png" alt="GitHub" />
            <span data-i18n="desktop.github">GitHub</span>
          </div>
        </nav>

        <section class="window" id="profileWindow" data-title="Profile">
          <header class="title-bar">
            <div class="title-bar-text">
              <span data-i18n="desktop.profile.bar">Profile</span>
            </div>
            <div class="title-bar-controls">
              <button aria-label="Close" onclick="closeWindow('profileWindow')"></button>
            </div>
          </header>

          <div class="window-body profile">
            <img src="assets/avatar.jpg" class="avatar" alt="Михаил Кривошеев">
            <div>
              <h1><strong data-i18n="profile.name"></strong></h1>
              <p>Software Engineer<br>Java / Spring / Android / Linux</p>
              <button onclick="window.open('https://github.com/NEXUSPROGECT')">GitHub</button>
            </div>
          </div>
        </section>

        <article class="window" id="aboutWindow" data-title="About.txt">
          <header class="title-bar">
            <div class="title-bar-text"><span data-i18n="desktop.about.bar">About.txt - Notepad</span></div>
            <div class="title-bar-controls">
              <button aria-label="Close" onclick="closeWindow('aboutWindow')"></button>
            </div>
          </header>

          <div class="window-body notepad">
            <span data-i18n="about.text"></span><span class="cursor" aria-hidden="true">|</span>
          </div>
        </article>

        <section class="window" id="projectsWindow" data-title="My Projects">
          <header class="title-bar">
            <div class="title-bar-text"><span data-i18n="desktop.projects.bar">My Projects</span></div>
            <div class="title-bar-controls">
              <button aria-label="Close" onclick="closeWindow('projectsWindow')"></button>
            </div>
          </header>

          <div class="window-body projects-folder">
            <div class="projects-container">
              <div id="projectsList" class="projects-grid"></div>
              <div class="projects-divider"></div>
              <div id="projectsPreview" class="projects-preview">
                <div class="preview-empty" data-i18n="projects.empty">Select a project to view details</div>
              </div>
            </div>
          </div>
        </section>

        <section class="window" id="screenshotViewerWindow" data-title="Image Viewer" style="display: none; position: absolute;">
          <header class="title-bar">
            <div class="title-bar-text">
              <span id="screenshotViewerTitle" data-i18n="viewer.title">Image Viewer</span>
            </div>
            <div class="title-bar-controls">
              <button aria-label="Close" onclick="closeWindow('screenshotViewerWindow')"></button>
            </div>
          </header>
          <div class="window-body screenshot-viewer-body">
            <div class="screenshot-viewer-title-header" id="screenshotViewerHeader"></div>
            <div class="screenshot-viewer-image-container">
              <img id="screenshotViewerImage" src="" alt="Screenshot">
            </div>
            <div class="screenshot-viewer-description" id="screenshotViewerDescription"></div>
          </div>
        </section>

        <footer class="taskbar">
          <button class="start-button" onclick="toggleStart()"><span data-i18n="desktop.start"></span></button>
          <div class="taskbar-windows" id="taskbarWindows"></div>
          <div class="taskbar-clock" id="clock"></div>
        </footer>

        <div class="mobile-footer">
          &copy; <script>document.write(new Date().getFullYear())</script> Nexus Project &nbsp;|&nbsp;
          <span data-i18n="footer.text">Windows XP Style</span>
        </div>
      </div>

      <nav class="start-menu" id="startMenu">
        <div class="start-header">Nexus Project</div>
        <button onclick="openWindow('profileWindow')"><span data-i18n="desktop.profile"></span></button>
        <button onclick="openWindow('aboutWindow')"><span data-i18n="desktop.about"></span></button>
        <button onclick="openWindow('projectsWindow')"><span data-i18n="desktop.projects"></span></button>
        <div class="start-menu-item has-submenu">
          <button><span data-i18n="startmenu.language">Language ▶</span></button>
          <div class="submenu">
            <button onclick="switchLanguage('ru')">Русский</button>
            <button onclick="switchLanguage('en')">English</button>
          </div>
        </div>
        <hr>
        <button onclick="window.open('https://github.com/NEXUSPROGECT')">GitHub</button>
      </nav>
  </div>
  <script src="js/i18n.js"></script>
  <script src="js/language-switcher.js"></script>
  <script src="js/app.js"></script>
  <script src="js/fakeload.js"></script>
  <script src="js/XP-friendly_draggable.js"></script>
  </body>
</html>
